[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxsecmonitor"
version = "0.1.0"
description = "Read-only Linux host inventory and security assessment tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
linuxsecmonitor = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["scanner"]
