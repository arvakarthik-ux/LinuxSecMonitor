name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Install project into the CI environment
        run: python -m pip install --no-deps .
      - name: Check installed CLI entry point
        run: linuxsecmonitor --help
      - name: Compile project and tests
        run: python -m compileall -q main.py scanner tests
      - name: Run deterministic offline test suite
        run: python -B -m pytest -q -p no:cacheprovider
